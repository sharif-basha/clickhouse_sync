[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "clickhouse_sync"
# The version lives in clickhouse_sync/__init__.py (__version__); flit reads it.
dynamic = ["version"]
description = "Sync ERPNext DocTypes to ClickHouse with retry, batching, Telegram alerts and analytics."
requires-python = ">=3.10"
license = { file = "license.txt" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["clickhouse-connect>=0.7.0", "requests>=2.28.0"]

[tool.flit.module]
name = "clickhouse_sync"
